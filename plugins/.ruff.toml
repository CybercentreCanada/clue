
line-length = 120
indent-width = 4
target-version = "py312"

[format]
exclude = ["clue/patched.py"]

[lint]
select = [
    "E",
    "F",
    "W",
    "C901",
    "I",
    "N",
    "D1",
    "D2",
    "ANN",
    "S",
    "T20",
    "PIE",
    "FLY",
    "TRY",
]
ignore = [
    "ANN003",
    "ANN201",
    "ANN401",
    "D100",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "N818",
    "S603",
    "TRY003",
    "TRY300",
]
exclude = [
    "clue/patched.py",
    "plugins/assemblyline_lookup/app.py",
    "plugins/**/test*.py",
]

[lint.flake8-annotations]
ignore-fully-untyped = true
mypy-init-return = true
suppress-dummy-args = true
suppress-none-returning = true

[lint.per-file-ignores]
"test/*" = ["C901", "D", "ANN", "S", "N818"]
"build_scripts/*" = ["D", "ANN", "S", "N818", "T201"]
"clue/app.py" = ["E402"]
"clue/api/v1/auth.py" = ["TRY301"]
"clue/common/classification.py" = ["D", "ANN", "C901", "TRY301", "T203"]
"clue/plugin/interactive.py" = ["T201"]
"clue/remote/datatypes/*" = ["D", "ANN", "C901"]
"clue/security/__init__.py" = ["TRY301"]
"plugins/nw_retention/app.py" = ["D200", "D205"]
"plugins/oracle/*" = [
    "F403",
    "D103",
    "D205",
    "F841",
    "C901",
    "ANN001",
    "E501",
    "T201",
    "TRY301",
    "TRY002",
    "S113",
    "F811",
    "I001",
    "N806",
    "TRY004",
]
