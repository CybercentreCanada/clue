images:
  ui:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  rest:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  apm:
    repository: elastic/apm-server
    tag: 8.6.2
    pullPolicy: IfNotPresent
  iconify:
    repository: iconify/api
    pullPolicy: Always

ui:
  name: enrichment-ui
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 500Mi

iconify:
  enabled: true
  name: enrichment-iconify
  resources:
    limits:
      cpu: 500m
      memory: 500Mi
    requests:
      cpu: 200m
      memory: 200Mi
  ingress:
    enabled: true

rest:
  name: enrichment-rest

  full_url: http://enrichment-rest.enrichment.svc.cluster.local:5000

  resources:
    limits:
      cpu: 750m
      memory: 1.5Gi
    requests:
      cpu: 250m
      memory: 750Mi

ingress:
  enabled: true

  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 128m

  rest:
    path: /api
  websocket:
    path: /socket
  ui:
    path: /

redis:
  architecture: standalone

  auth:
    enabled: true
    existingSecret: enrichment-redis

  master:
    persistence:
      enabled: false

    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 2
        memory: 4Gi

config:
  auth:
    oauth:
      enabled: true
      providers: {} # This must be overridden
    allow_apikeys: true

  core:
    redis:
      host: enrichment-redis-master.enrichment.svc.cluster.local
      port: 6379

  logging:
    log_level: DEBUG
    log_as_json: false

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    # - type: Pod
    #   pods:

  behavior:
    scaleUp:
      #     policies:
      #       # Only spawn an extra 2 pods in a 1 minute window
      #       - type: Pods
      #         value: 2
      #         periodSeconds: 60
      #     #
      stabilizationWindowSeconds: 120
  #   scaleDown:
  #     stabilizationWindowSeconds: 60

apm:
  enabled: false

  # APM has its own logging levels.
  loggingLevel: info

  # When Flask is in debug mode apm defaults to not shipping its metrics.
  # This enables it to work still.
  workWithDebug: "True"

  tokenSecret: enrichment-apm-credentials
  tokenKey: token

metrics:
  enabled: true
  podMonitor:
    enabled: true
