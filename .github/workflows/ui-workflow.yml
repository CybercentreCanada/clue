name: Clue UI

on:
  push:
    branches:
      - main
      - develop
      - rc/*
      - patch/*
    paths:
      - "ui/**"
      - "!ui/LICENSE"
      - "!ui/README.md"
      - .github/workflows/ui-workflow.yml
    tags:
      - v*
  pull_request:
    branches:
      - main
      - develop
      - rc/*
      - patch/*
    paths:
      - "ui/**"
      - "!ui/LICENSE"
      - "!ui/README.md"
      - .github/workflows/ui-workflow.yml
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  formatting:
    name: Validate Clue UI Code Quality

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
      - name: Install Node v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm v10
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Get pnpm store path
        id: pnpm-cache-dir
        run: echo "PNPM_CACHE_DIR=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v3
        name: Define a cache for node_modules
        with:
          path: |
            ${{ steps.pnpm-cache-dir.outputs.PNPM_CACHE_DIR }}
            ~/.pnpm-store # Fallback for older pnpm versions or specific configurations
            ui/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run prettier formatting checks
        run: |
          pnpm run lint-validate
      - name: Run eslint linter checks
        run: |
          npx eslint@8 src
      - name: Run Unit Tests
        run: pnpm test
      - name: Report Coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ui/target/coverage/coverage-summary.json
          json-final-path: ui/target/coverage/coverage-final.json

  push_to_npm:
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    name: Publish Clue to NPM

    needs:
      - formatting

    defaults:
      run:
        working-directory: ./ui

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
      - name: Install Node v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Install pnpm v10
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Get pnpm store path
        id: pnpm-cache-dir
        run: echo "PNPM_CACHE_DIR=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v3
        name: Define a cache for node_modules
        with:
          path: |
            ${{ steps.pnpm-cache-dir.outputs.PNPM_CACHE_DIR }}
            ~/.pnpm-store # Fallback for older pnpm versions or specific configurations
            ui/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Set Package Version
        run: |
          python build_scripts/set_version.py
        env:
          BRANCH: ${{ github.ref }}
          BUILD_ID: ${{ github.run_number }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build UI
        run: |
          pnpm build-lib
          python build_scripts/prep_for_publish.py
        env:
          VITE_BRANCH: ${{ github.ref }}
          VITE_COMMIT_HASH: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=16384

      - name: Check Package Version Type
        id: version-check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION"

          # Check for specific prerelease identifiers and set appropriate npm tag
          if echo "$VERSION" | grep -qE '\-dev'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "npm_tag=development" >> $GITHUB_OUTPUT
            echo "Detected development version: $VERSION (will publish with --tag development)"
          elif echo "$VERSION" | grep -qE '\-rc'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "npm_tag=release-candidate" >> $GITHUB_OUTPUT
            echo "Detected release candidate version: $VERSION (will publish with --tag release-candidate)"
          elif echo "$VERSION" | grep -qE '\-patch'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "npm_tag=patch-prerelease" >> $GITHUB_OUTPUT
            echo "Detected patch prerelease version: $VERSION (will publish with --tag patch-prerelease)"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
            echo "Detected standard release version: $VERSION (will publish with --tag latest)"
          fi
        working-directory: ui/dist

      # Can't use latest currently: https://github.com/npm/cli/issues/9722
      # npm install -g npm@latest
      - name: Publish Built Package
        run: |
          npm install -g npm@11
          npm publish --access public --tag ${{ steps.version-check.outputs.npm_tag }}
        working-directory: ui/dist  # Publish from the built dist directory


  push_to_registry:
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    name: Build Clue UI Docker Image

    needs:
      - formatting

    defaults:
      run:
        working-directory: ./ui

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
      - name: Install Node v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Install pnpm v10
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Get pnpm store path
        id: pnpm-cache-dir
        run: echo "PNPM_CACHE_DIR=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v3
        name: Define a cache for node_modules
        with:
          path: |
            ${{ steps.pnpm-cache-dir.outputs.PNPM_CACHE_DIR }}
            ~/.pnpm-store # Fallback for older pnpm versions or specific configurations
            ui/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Set Package Version
        run: |
          python build_scripts/set_version.py
        env:
          BRANCH: ${{ github.ref }}
          BUILD_ID: ${{ github.run_number }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build UI
        run: |
          pnpm build
        env:
          VITE_BRANCH: ${{ github.ref }}
          VITE_COMMIT_HASH: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=16384
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract Clue UI version
        id: version
        run: |
          python -c "import json;print('version='+json.load(open('package.json', 'r'))['version'].split('-')[0])" >> $GITHUB_OUTPUT
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: cccs/clue-ui
          tags: |
            type=raw,event=branch,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags') }}
            type=raw,event=branch,value=nightly,enable=${{ github.ref == format('refs/heads/{0}', 'develop') }}
            type=semver,pattern={{version}}
            type=raw,value=${{steps.version.outputs.version}}_{{branch}}
            type=raw,value=${{steps.version.outputs.version}}_{{branch}}_{{sha}}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push UI Docker image
        id: push
        uses: docker/build-push-action@v3
        with:
          context: ui
          file: ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            version=${{ steps.meta.outputs.version }}
            branch=${{ github.ref }}
            commit=${{ github.sha }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/cccs/clue-ui
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
