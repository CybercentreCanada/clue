name: Clue API

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "!api/LICENSE"
      - "!api/README.md"
      - "!api/docs/**"
      - "!api/build_scripts/generate_classes.py"
      - .github/workflows/api-workflow.yml
      - .github/workflows/release-validation.yml
      - scripts/validate_release.py
    tags:
      - api-v*
  pull_request:
    branches:
      - main
    paths:
      - "api/**"
      - "!api/LICENSE"
      - "!api/README.md"
      - "!api/docs/**"
      - "!api/build_scripts/generate_classes.py"
      - .github/workflows/api-workflow.yml
      - .github/workflows/release-validation.yml
      - scripts/validate_release.py
      - "!api/plugin/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish stable artifacts from a verified native component tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  release_validation:
    uses: ./.github/workflows/release-validation.yml
    with:
      component: api
      component_dir: api
      tag_prefix: api-v
      allow_main_preview: true
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    permissions:
      contents: read

  formatting:
    name: Validate Clue API Code Quality

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry

      - uses: actions/cache@v4
        name: Define a cache for the virtual environment based on the dependencies lock file
        with:
          path: ./api/.venv
          key: venv-${{ hashFiles('api/poetry.lock') }}

      - name: Check for poetry config integrity
        run: |
          poetry --version
          poetry env use 3.12
          poetry check
          poetry env info

      - name: Install Dependencies
        run: poetry install --verbose --with test

      - name: Run ruff formatting checks
        run: poetry run ruff format clue --diff

      - name: Run ruff linter checks
        run: poetry run ruff check clue --output-format=github

      - name: Run type checking
        run: poetry run type_check

  test:
    runs-on: ubuntu-latest

    name: Run Clue API Unit Tests

    needs: formatting

    defaults:
      run:
        working-directory: api
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Get base depth of PR
        if: github.event_name == 'pull_request'
        id: base-depth
        working-directory: .
        run: echo "base-depth=$((${{ github.event.pull_request.commits }} + 1))" >> "$GITHUB_OUTPUT"

      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ steps.base-depth.outputs.base-depth || 1 }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Spin up test dependencies
        uses: ./.github/actions/compose
        with:
          compose-file: api/dev/docker-compose.yml
          build: "true"

      - name: Show dependency status
        if: always()
        run: |
          docker compose -f dev/docker-compose.yml ps
          docker compose -f dev/docker-compose.yml logs

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4

      - uses: actions/cache@v4
        name: Define a cache for the virtual environment based on the dependencies lock file
        with:
          path: ./api/.venv
          key: venv-${{ hashFiles('api/poetry.lock') }}

      - name: Setup Environment
        run: |
          sudo mkdir -p /etc/clue/conf/
          sudo mkdir -p /etc/clue/lookups/
          sudo mkdir -p /var/log/clue
          sudo chmod a+rw /etc/clue/conf/
          sudo chmod a+rw /etc/clue/lookups/
          sudo chmod a+rw /var/log/clue
          cp build_scripts/classification.yml /etc/clue/conf/classification.yml
          cp test/unit/config.yml /etc/clue/conf/config.yml

      - name: Install Dependencies
        run: poetry install --all-extras -vvv --with test

      - name: Ensure docker compose is healthy
        run: poetry run python build_scripts/docker_health.py

      - name: Docker compose log dump on failure
        if: failure()
        run: |
          echo "Status:"
          docker compose ls
          docker compose ps

          echo "Logs:"
          docker compose logs
        working-directory: api/dev

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          poetry run test
        env:
          WRITE_MARKDOWN: "true"

      - name: Add Failed Test PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request' && steps.tests.outcome == 'failure'
        # https://github.com/marocchino/sticky-pull-request-comment/issues/227
        continue-on-error: true
        with:
          path: api/test-results.md
          header: api

      - name: Coverage Results
        if: steps.tests.outcome == 'success'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --depth=1 origin "$BASE_SHA"
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            git diff --name-only "$merge_base..$HEAD_SHA"
            git diff "$merge_base..$HEAD_SHA" > diff.txt
          else
            rm -f diff.txt
          fi
          poetry run coverage_report
          cat coverage-results.md >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: steps.tests.outcome == 'success' && github.event_name == 'pull_request' && matrix.python-version == '3.12'
        # https://github.com/marocchino/sticky-pull-request-comment/issues/227
        continue-on-error: true
        with:
          path: api/coverage-results.md
          header: api

      - name: Force Failure if Tests Failed
        if: steps.tests.outcome == 'failure'
        run: |
          exit 1

      - name: Save coverage for GitHub Code Quality
        if: steps.tests.outcome == 'success' && matrix.python-version == '3.12' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-api
          path: api/coverage.xml
          if-no-files-found: error
          retention-days: 1

  upload_coverage:
    name: Upload API coverage to GitHub Code Quality
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: code-coverage-api
      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/api

  test_docker_build:
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    name: Test Clue API Docker Image Build

    needs:
      - formatting
      - test

    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
      - uses: actions/cache@v4
        name: Define a cache for the virtual environment based on the dependencies lock file
        with:
          path: ./api/.venv
          key: venv-${{ hashFiles('api/poetry.lock') }}
      - name: Install Dependencies and Build
        run: |
          cp -r ../docs .
          poetry install
          poetry build
      - name: Extract Clue API version
        id: version
        run: |
          echo "version=$(poetry version -s)" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Test build API Docker image (no push)
        uses: docker/build-push-action@v3
        with:
          context: api
          file: api/Dockerfile
          push: false
          tags: clue-api:test
          build-args: |
            version=${{ steps.version.outputs.version }}
            branch=${{ github.ref }}
            commit=${{ github.sha }}

  push_to_pypi:
    if: needs.release_validation.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    name: Build and publish stable Clue API Python Package
    permissions:
      contents: read
    needs:
      - release_validation
      - formatting
      - test
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python3 -m pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Build package
        run: poetry build
      - name: Publish stable package to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          poetry config pypi-token.pypi "$PYPI_TOKEN"
          poetry publish

  push_to_registry:
    if: needs.release_validation.outputs.channel == 'preview' || needs.release_validation.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    name: Build Clue API Docker Image
    needs:
      - release_validation
      - formatting
      - test
    defaults:
      run:
        working-directory: ./api
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python3 -m pip install poetry
      - name: Install Dependencies and Build
        run: |
          cp -r ../docs .
          poetry install --no-interaction
          poetry build
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: cccs/clue-api
          flavor: latest=${{ needs.release_validation.outputs.channel == 'stable' }}
          tags: |
            type=raw,value=${{ needs.release_validation.outputs.version }},enable=${{ needs.release_validation.outputs.channel == 'stable' }}
            type=raw,value=nightly,enable=${{ needs.release_validation.outputs.channel == 'preview' }}
            type=sha,format=short
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push API Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            version=${{ needs.release_validation.outputs.version }}
            branch=${{ github.ref }}
            commit=${{ github.sha }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/cccs/clue-api
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
