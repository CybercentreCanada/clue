name: Lint and Format Plugin

on:
  workflow_call:
    inputs:
      plugin-path:
        required: true
        type: string

jobs:
  push_to_registry:
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    name: Build Clue Base Plugin Docker Image

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Checkout current ref
        uses: actions/checkout@v4
      - name: Install yq
        run: sudo snap install yq
      - name: Extract Clue Base Plugin version
        id: base-plugin-version
        uses: mikefarah/yq@master
        with:
          cmd: yq '.base-plugin-tag // "${{github.ref == 'refs/heads/develop' && 'nightly' || 'latest'}}"' '${{inputs.plugin-path}}/manifest.yml'
      - name: Extract Plugin version
        id: plugin-version
        uses: mikefarah/yq@master
        with:
          cmd: yq '.version // "0.0.1"' '${{inputs.plugin-path}}/manifest.yml'
      - name: Extract Plugin Name
        id: plugin-name
        uses: mikefarah/yq@master
        with:
          cmd: yq '.name' '${{inputs.plugin-path}}/manifest.yml'
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: cccsaurora/clue-plugin-${{steps.plugin-name.outputs.result}}
          tags: |
            type=raw,event=branch,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags') }}
            type=raw,value=${{steps.plugin-version.outputs.result}}.${{ github.run_number }}
            type=raw,value=${{steps.plugin-version.outputs.result}}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Clue Base Plugin Docker image
        id: push
        uses: docker/build-push-action@v3
        with:
          context: ${{inputs.plugin-path}}
          file: plugins/build_scripts/release.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            base_plugin_version=${{steps.base-plugin-version.outputs.result}}
            version=${{ steps.base-plugin-version.outputs.result }}
            branch=${{ github.ref }}
            commit=${{ github.sha }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/cccsaurora/clue-plugin-base
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
