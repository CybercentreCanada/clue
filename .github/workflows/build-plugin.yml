name: Lint and Format Plugin

on:
  workflow_call:
    inputs:
      plugin-path:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: plugins/base/plugin.Dockerfile
      no-cache:
        required: false
        type: boolean
        default: false

env:
  BUILD_REF: ${{ github.event_name == 'workflow_run' && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}
  BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  push_to_registry:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest

    name: Build Docker Image

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
      - name: Install yq
        run: sudo snap install yq
      - name: Extract Plugin Medata
        id: plugin-metadata
        run: |
          BASE_PLUGIN_TAG=$(yq '.base-plugin-tag // "${{env.BUILD_REF == 'refs/heads/develop' && 'nightly' || 'latest'}}"' '${{inputs.plugin-path}}/manifest.yml')
          PLUGIN_VERSION=$(yq '.version // "0.0.1"' '${{inputs.plugin-path}}/manifest.yml')
          PLUGIN_NAME=$(yq '.name' '${{inputs.plugin-path}}/manifest.yml')
          echo "base-plugin-tag=$BASE_PLUGIN_TAG" >> $GITHUB_OUTPUT
          echo "version=$PLUGIN_VERSION" >> $GITHUB_OUTPUT
          echo "name=$PLUGIN_NAME" >> $GITHUB_OUTPUT

      - name: Add requirements.txt and pip.conf if it's missing
        run: touch requirements.txt && touch pip.conf
        working-directory: ${{inputs.plugin-path}}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: cccs/clue-plugin-${{steps.plugin-metadata.outputs.name}}
          tags: |
            type=raw,event=branch,value=nightly,enable=${{ env.BUILD_REF == format('refs/heads/{0}', 'develop') }}
            type=raw,event=branch,value=latest,enable=${{ env.BUILD_REF == format('refs/heads/{0}', 'main') }}
            type=raw,value=latest,enable=${{ startsWith(env.BUILD_REF, 'refs/tags') }}
            type=semver,pattern={{version}}
            type=raw,value=${{steps.plugin-metadata.outputs.version}}_{{branch}}
            type=raw,value=${{steps.plugin-metadata.outputs.version}}_{{branch}}_{{sha}}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker image
        id: push
        uses: docker/build-push-action@v3
        with:
          context: ${{inputs.plugin-path}}
          file: ${{inputs.dockerfile}}
          no-cache: ${{inputs.no-cache}}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            base_plugin_version=${{steps.plugin-metadata.outputs.base-plugin-tag}}
            version=${{ steps.plugin-metadata.outputs.version }}
            branch=${{ env.BUILD_REF }}
            commit=${{ env.BUILD_SHA }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/cccs/clue-plugin-${{steps.plugin-metadata.outputs.name}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
