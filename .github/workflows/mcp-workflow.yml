name: Clue MCP

on:
  push:
    branches:
      - main
    paths:
      - "mcp/**"
      - .github/workflows/mcp-workflow.yml
      - .github/workflows/release-validation.yml
      - scripts/validate_release.py
    tags:
      - mcp-v*
  pull_request:
    branches:
      - main
    paths:
      - "mcp/**"
      - .github/workflows/mcp-workflow.yml
      - .github/workflows/release-validation.yml
      - scripts/validate_release.py
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish stable artifacts from a verified native component tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  release_validation:
    uses: ./.github/workflows/release-validation.yml
    with:
      component: mcp
      component_dir: mcp
      tag_prefix: mcp-v
      allow_main_preview: true
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    permissions:
      contents: read

  formatting:
    name: Validate Clue MCP Code Quality

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4

      - name: Check Poetry configuration
        run: |
          poetry --version
          poetry env use 3.12
          poetry check
          poetry env info

      - name: Install Dependencies
        run: poetry install --verbose --with dev

      - name: Run ruff formatting checks
        run: poetry run ruff format clue_mcp --diff

      - name: Run ruff linter checks
        run: poetry run ruff check . --output-format=github

  test:
    name: Run Clue MCP Unit Tests

    needs: formatting

    env:
      AUTH_CLIENT_ID: clue

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Get base depth of PR
        if: github.event_name == 'pull_request'
        id: base-depth
        working-directory: .
        run: echo "base-depth=$((${{ github.event.pull_request.commits }} + 1))" >> "$GITHUB_OUTPUT"

      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ steps.base-depth.outputs.base-depth || 1 }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4

      - name: Check Poetry configuration
        run: |
          poetry --version
          poetry env use 3.12
          poetry check
          poetry env info

      - name: Install Dependencies
        run: poetry install --verbose --with dev

      - name: Configure test client secret
        working-directory: .
        run: |
          jq -r '.clients[] | select(.clientId == "clue") | "AUTH_CLIENT_SECRET=\(.secret)"' \
            api/dev/keycloak/keycloak-realm.json >> "$GITHUB_ENV"

      - name: Spin up full test dependencies
        uses: ./.github/actions/compose
        with:
          compose-file: mcp/docker-compose.yml
          profile: full
          services: |
            clue-api
            mongodb
            redis
            keycloak
            test-plugin
            bad-plugin
            slow-plugin
            telemetry-plugin

      - name: Start Clue MCP server
        run: |
          poetry run coverage erase --data-file=.coverage.server
          CLUE_API_BASE_URL=http://localhost:5000/api/v1 \
          AUTH_HOST=localhost \
          AUTH_TOKEN_URL=http://localhost:9100/realms/HogwartsMini/protocol/openid-connect/token \
          AUTH_JWKS_URI=http://localhost:9100/realms/HogwartsMini/protocol/openid-connect/certs \
          AUTH_ISSUER=http://localhost:9100/realms/HogwartsMini \
          AUTH_AS_SERVER_URL=http://localhost:9100/realms/HogwartsMini \
          COVERAGE_FILE=.coverage.server poetry run coverage run -m clue_mcp.server > /tmp/clue-mcp-server.log 2>&1 &
          echo $! > mcp-server.pid
          curl --retry 15 --retry-delay 2 --retry-all-errors -sS -o /dev/null http://localhost:8000/mcp

      - name: Run tests
        id: tests
        continue-on-error: true
        run: poetry run test
        env:
          WRITE_MARKDOWN: "true"
          RUN_MCP_NETWORK_TESTS: "1"
          TEST_AUTH_USERNAME: goose
          TEST_AUTH_PASSWORD: goose
          CLUE_API_BASE_URL: http://localhost:5000/api/v1
          COVERAGE_FILE: .coverage.tests

      - name: Print dependency logs after failed tests
        if: steps.tests.outcome == 'failure'
        run: |
          echo "--- Clue API and dependency logs ---"
          docker compose -f docker-compose.yml logs --no-color clue-api mongodb redis keycloak test-plugin bad-plugin slow-plugin telemetry-plugin
          echo "--- Clue MCP server logs ---"
          if [ -f /tmp/clue-mcp-server.log ]; then
            cat /tmp/clue-mcp-server.log
          else
            echo "MCP server log file was not created"
          fi

      - name: Stop MCP server and combine coverage
        if: always()
        run: |
          if [ -f mcp-server.pid ]; then
            kill "$(cat mcp-server.pid)" || true
            wait "$(cat mcp-server.pid)" || true
          fi
          poetry run coverage combine

      - name: Add Failed Test PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request' && steps.tests.outcome == 'failure'
        continue-on-error: true
        with:
          path: mcp/test-results.md
          header: mcp

      - name: Coverage Results
        if: steps.tests.outcome == 'success'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --depth=1 origin "$BASE_SHA"
            git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")..$HEAD_SHA"
            git diff "$(git merge-base "$BASE_SHA" "$HEAD_SHA")..$HEAD_SHA" > diff.txt
          else
            rm -f diff.txt
          fi
          poetry run coverage_report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: steps.tests.outcome == 'success' && github.event_name == 'pull_request'
        continue-on-error: true
        with:
          path: mcp/coverage-results.md
          header: mcp

      - name: Force Failure if Tests Failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  build_docker_image:
    if: needs.release_validation.outputs.channel == 'preview' || needs.release_validation.outputs.channel == 'stable'

    runs-on: ubuntu-latest

    name: Build and Publish Clue MCP Docker Image

    needs:
      - release_validation
      - test

    defaults:
      run:
        working-directory: mcp

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up chainctl with howler identity
        uses: chainguard-dev/setup-chainctl@main
        with:
          identity: 42b9b0076fcee50f3ee6d013eadb93841a051303/e427bc7a20eb5423

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: cccs/clue-mcp
          flavor: latest=${{ needs.release_validation.outputs.channel == 'stable' }}
          tags: |
            type=raw,value=${{ needs.release_validation.outputs.version }},enable=${{ needs.release_validation.outputs.channel == 'stable' }}
            type=raw,value=nightly,enable=${{ needs.release_validation.outputs.channel == 'preview' }}
            type=sha,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push MCP Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: mcp
          file: mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: |
            pip_ca=/etc/ssl/certs/ca-certificates.crt
          build-args: |
            version=${{ needs.release_validation.outputs.version }}
            branch=${{ github.ref }}
            commit=${{ github.sha }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/cccs/clue-mcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
