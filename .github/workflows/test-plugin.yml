name: Test Plugin

on:
  workflow_call:
    inputs:
      plugin-path:
        required: true
        type: string

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if test files exist
        run: |
          echo "Checking for test directories in ${{ inputs.plugin-path }}"
          
          # Check if either 'test' or 'tests' directory exists
          if [ -d "${{ inputs.plugin-path }}/test" ] || [ -d "${{ inputs.plugin-path }}/tests" ]; then
            if [ -d "${{ inputs.plugin-path }}/test" ]; then
              echo "✅ Found 'test' directory"
            fi
            if [ -d "${{ inputs.plugin-path }}/tests" ]; then
              echo "✅ Found 'tests' directory"
            fi
          else
            echo "❌ No test directory found. Expected either 'test' or 'tests' folder in ${{ inputs.plugin-path }}"
            echo "Skipping test execution as no tests are available."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run Tests
        run: python -m pytest -s -v ${{inputs.plugin-path}}
