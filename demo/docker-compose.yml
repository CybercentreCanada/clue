services:

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    environment:
      KC_HEALTH_ENABLED: "true"
    ports:
      - "9100:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - clue-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - clue-network

  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - clue-network

  clue-api:
    image: cccs/clue-api:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      WORKERS: 1

      # Redis Connection
      CORE__REDIS__HOST: redis
      CORE__REDIS__PORT: 6379

      # MongoDB Connection
      CORE__MONGODB__HOST: mongodb

      # Application Settings
      API__SECRET_KEY: dev-secret-key
      API__DEBUG: "true"

      # Authentication
      AUTH__OAUTH__ENABLED: "true"
      AUTH__OAUTH__PROVIDERS__KEYCLOAK__AUDIENCE: "clue"
      AUTH__OAUTH__PROVIDERS__KEYCLOAK__ACCESS_TOKEN_URL: "http://keycloak:8080/realms/HogwartsMini/protocol/openid-connect/token"
      AUTH__OAUTH__PROVIDERS__KEYCLOAK__AUTHORIZE_URL: "http://localhost:9100/realms/HogwartsMini/protocol/openid-connect/auth"
      AUTH__OAUTH__PROVIDERS__KEYCLOAK__API_BASE_URL: "http://keycloak:8080/realms/HogwartsMini/protocol/openid-connect/userinfo"
      AUTH__OAUTH__PROVIDERS__KEYCLOAK__CLIENT_ID: "clue"
      AUTH__OAUTH__PROVIDERS__KEYCLOAK__CLIENT_SECRET: "09RhSF7tp0ShDdDMCszqI4zk8HMroTTZ"
      AUTH__OAUTH__PROVIDERS__KEYCLOAK__JWKS_URI: "http://keycloak:8080/realms/HogwartsMini/protocol/openid-connect/certs"
      AUTH__OAUTH__PROVIDERS__KEYCLOAK__SCOPE: "openid profile email"
      AUTH__OAUTH__PROVIDERS__KEYCLOAK__AUTO_CREATE: "true"

      # Plugin Discovery
      # Configuring the Port Lookup plugin as an external source
      API__EXTERNAL_SOURCES: |
        [
          {"name": "port-lookup", "url": "http://port-lookup:5100", "classification": "TLP:CLEAR"},
          {"name": "crt-sh", "url": "http://crtsh:5101", "classification": "TLP:CLEAR"}
        ]
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - clue-network

  clue-ui:
    image: cccs/clue-ui:latest
    restart: unless-stopped
    networks:
      - clue-network

  port-lookup:
    image: cccs/clue-plugin-port-lookup:latest
    restart: unless-stopped
    ports:
      - "5100:5100"
    environment:
      APP_NAME: port-lookup
      CLASSIFICATION: TLP:CLEAR
      WORKERS: 1
      PORT: 5100
      # Redis for the plugin (optional, but good practice if it uses cache)
      CORE__REDIS__HOST: redis
      CORE__REDIS__PORT: 6379
    networks:
      - clue-network

  crtsh:
    image: cccs/clue-plugin-crtsh:latest
    restart: unless-stopped
    ports:
      - "5101:5101"
    environment:
      APP_NAME: crtsh
      CLASSIFICATION: TLP:CLEAR
      WORKERS: 1
      PORT: 5101
      # Redis for the plugin (optional, but good practice if it uses cache)
      CORE__REDIS__HOST: redis
      CORE__REDIS__PORT: 6379
    networks:
      - clue-network

  misp:
    profiles:
      - misp
    image: cccs/clue-plugin-misp:latest
    restart: unless-stopped
    ports:
      - "5102:5102"
    env_file:
      - path: ./misp.env
        required: false
    environment:
      APP_NAME: misp
      CLASSIFICATION: TLP:CLEAR
      WORKERS: 1
      PORT: 5102
      # Redis for the plugin (optional, but good practice if it uses cache)
      CORE__REDIS__HOST: redis
      CORE__REDIS__PORT: 6379
    networks:
      - clue-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - clue-api
      - clue-ui
    networks:
      - clue-network

networks:
  clue-network:
    name: clue-network
