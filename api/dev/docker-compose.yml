services:
  redis:
    image: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - clue-network

  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - clue-network

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    environment:
      KC_HEALTH_ENABLED: "true"
    ports:
      - "9100:8080"
    expose:
      - "9100"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - clue-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "444:444"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - clue-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  clue-network:
    name: clue-network
